name: Update RT Certified Fresh RSS feed

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; adjust as you like
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python rt_certified_fresh_feed.py docs/rss.xml

      - name: Disable Jekyll processing on Pages
        run: touch docs/.nojekyll

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rss.xml docs/.nojekyll
          git diff --quiet --cached || git commit -m "Update RT feed"
          git push
